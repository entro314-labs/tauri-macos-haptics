[package]
name = "macos-haptics-example"
version = "0.0.0"
description = "Example Tauri app for the tauri-macos-haptics plugin."
authors = ["Entro314 Labs"]
license = "MIT"
repository = "https://github.com/entro314-labs/tauri-macos-haptics"
edition = "2024"
publish = false

[lib]
name = "macos_haptics_example_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-macos-haptics = { path = "../../" }
